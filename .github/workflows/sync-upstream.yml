name: Sync Upstream

on:
  schedule:
    # Poll upstream every 6 hours for main + new tags.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      sync_tags:
        description: "Also create missing tags on fork HEAD"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/2389-research/MermaidKit.git
          # Fetch main only — do NOT fetch upstream tags. Fetching them would
          # create local refs/tags/* pointing at upstream commits, and then
          # `git tag -a <same-name>` fails with exit 128 (tag already exists).
          git fetch upstream main
          git fetch origin main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main into fork main
        id: merge
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already_up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream/main"
            exit 0
          fi

          echo "already_up_to_date=false" >> "$GITHUB_OUTPUT"
          # Preserve fork commits; fail on conflict so changes are never dropped silently.
          git merge --no-edit upstream/main

      - name: Push main
        if: steps.merge.outputs.already_up_to_date != 'true'
        run: git push origin main

      - name: Create missing tags on fork HEAD
        if: github.event_name == 'schedule' || inputs.sync_tags
        run: |
          set -euo pipefail

          MIN_TAG="v2.7.0"

          # Tag names via ls-remote only — never fetch/push upstream tag objects
          # (those point at upstream commits and would drop fork-local changes).
          # Skip anything older than MIN_TAG.
          git ls-remote --tags upstream 'refs/tags/*' \
            | awk '{print $2}' | sed 's#refs/tags/##' | sed 's/\^{}//' \
            | grep -E '^v[0-9]' | sort -u \
            | awk -v min="$MIN_TAG" '
                function verkey(s,    a,n,i,out) {
                  n = split(substr(s, 2), a, /[.]/)
                  out = ""
                  for (i = 1; i <= n; i++) out = out sprintf("%06d.", a[i]+0)
                  return out
                }
                verkey($0) >= verkey(min) { print }
              ' > /tmp/upstream-tags.txt

          git ls-remote --tags origin 'refs/tags/*' \
            | awk '{print $2}' | sed 's#refs/tags/##' | sed 's/\^{}//' \
            | sort -u > /tmp/origin-tags.txt

          created=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            if grep -Fxq "$tag" /tmp/origin-tags.txt; then
              continue
            fi
            # Drop any leftover local tag with this name before retargeting HEAD.
            git tag -d "$tag" 2>/dev/null || true
            git tag -a "$tag" HEAD -m "Fork release $tag (own commits preserved)"
            git push origin "refs/tags/$tag"
            echo "Tagged fork HEAD as $tag ($(git rev-parse --short HEAD))"
            created=$((created + 1))
          done < <(comm -23 /tmp/upstream-tags.txt /tmp/origin-tags.txt)

          echo "Created $created new tag(s) (>= $MIN_TAG)"
